# General
set-option -g default-shell /usr/bin/fish
set-option -sa terminal-overrides ",xterm-256col*:Tc"

set -g default-terminal "tmux-256color"
set -g mode-keys vi
set -g mouse on
set -s set-clipboard on

bind-key C-q detach-client
bind-key -T copy-mode-vi y send-keys -X copy-pipe "wl-copy"
bind-key -T copy-mode-vi q send-keys -X cancel

# Status bar
set -g status-left-length 50

# Tokyo Night
set -g status-style bg='#1a1b26',fg='#a9b1d6'
set -g window-status-current-style \
    bg='#1a1b26',fg='#7aa2f7'
set -g pane-border-style \
    fg='#3b4261'
set -g pane-active-border-style \
    fg='#7aa2f7'

# Session management
# Create/select a session from a directory
bind-key -n C-f new-window \
    -n "session-picker" \
    "tmux-sessionizer"

# Select / switch / delete existing sessions
bind-key -n C-s display-popup -E \
    "~/.local/bin/tmux-session-picker"

# TPM
set -g @plugin 'tmux-plugins/tpm'

run '~/.tmux/plugins/tpm/tpm'
