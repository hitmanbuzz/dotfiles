set-option -g default-shell /usr/bin/fish
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-256col*:Tc"
setw -g mode-keys vi

set -g status-left-length 50

# Tokyo Night colors
set -g status-style bg='#1a1b26',fg='#a9b1d6'
set -g window-status-current-style bg='#1a1b26',fg='#7aa2f7'
set -g pane-border-style fg='#3b4261'
set -g pane-active-border-style fg='#7aa2f7'

# 1. Ctrl+F: Create new session (uses the script we made)
# Using display-popup for a floating window feel (requires tmux 3.2+)
bind-key -n C-f display-popup -E "tmux-sessionizer"

# Alternative: If you prefer a full window instead of a popup, use this instead:
# bind-key -n C-f new-window -n "session-picker" "tmux-sessionizer"

bind-key -n C-s display-popup -E "\
    tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
    sed '/^$/d' |\
    fzf --reverse --header 'Jump to Session (Ctrl-x to kill)' \
    --preview 'tmux capture-pane -pt {}' \
    --bind 'ctrl-x:execute(tmux kill-session -t {})+reload(tmux list-sessions -F \"#{?session_attached,,#{session_name}}\" | sed \"/^$/d\")' \
    |\
    xargs tmux switch-client -t"

set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
