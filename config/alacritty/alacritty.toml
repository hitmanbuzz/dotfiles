[general]
import = [
  "themes/themes/ayu_dark.toml"
]

[terminal]
shell = { program = "/bin/fish", args = ["-l"] }

[env]
TERM = "xterm-256color"

[font]
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Medium" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Medium" }
size = 13

[window]
dynamic_padding = true
opacity = 0.95

[mouse]
hide_when_typing = true
