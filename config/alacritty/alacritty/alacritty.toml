[general]
import = [
  "themes/themes/github_dark_high_contrast.toml"
]

[env]
TERM = "xterm-256color"

[font]
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Medium" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Medium" }
size = 13

[window]
dynamic_padding = true
decorations = "None"
opacity = 1.0

[mouse]
hide_when_typing = true
