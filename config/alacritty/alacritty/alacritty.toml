[general]
import = [
  "themes/themes/github_dark_high_contrast.toml"
]

[env]
TERM = "xterm-256color"

# [terminal.shell]
# program = "zellij"
# args = ["-l", "welcome"]

# Another font: JetBrainsMono Nerd Font
[font]
normal = { family = "DejaVuSansM Nerd Font Mono" }
bold = { family = "DejaVuSansM Nerd Font Mono" }
italic = { family = "DejaVuSansM Nerd Font Mono" }
size = 13

[window]
padding.x = 1
padding.y = 1
dynamic_padding = true
decorations = "None"
opacity = 1.0
blur = true

[colors]
transparent_background_colors = true
